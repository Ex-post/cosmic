<!-- Analytics: Google Analytics 4, loads ONLY after "Accept" on the cookie banner.
     1. Create a GA4 property, copy the Measurement ID (G-XXXXXXX) below.
     2. In the cookie "Accept" button handler call: window.cosmicLoadAnalytics() -->
<script>
  window.cosmicLoadAnalytics = function () {
    if (window.__ga) return; window.__ga = true;
    var s = document.createElement('script');
    s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', 'G-XXXXXXXXXX', { anonymize_ip: true });
  };
  try { if (localStorage.getItem('cosmic-consent') === 'all') window.cosmicLoadAnalytics(); } catch (e) {}
</script>
